global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'orders-api'
    dns_sd_configs:
      - names: ['orders-api']
        type: A
        port: 80
        refresh_interval: 15s

  - job_name: 'payment-api'
    dns_sd_configs:
      - names: ['payment-api']
        type: A
        port: 80
        refresh_interval: 15s

  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']
