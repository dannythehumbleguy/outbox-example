- name: Create temporary file for secret
  ansible.builtin.tempfile:
    state: file
  register: secret_file
  no_log: true

- name: Store secret in AWS
  block:
    - name: Write secret to temporary file
      ansible.builtin.copy:
        content: "{{ {'SecretId': secret_id, 'SecretString': secret_value} | to_json }}"
        dest: "{{ secret_file.path }}"
        mode: '0600'
      no_log: true
    - name: Upload secret
      ansible.builtin.command:
        argv: [aws, secretsmanager, put-secret-value, --region, "{{ aws_region }}", --cli-input-json, "file://{{ secret_file.path }}", --no-cli-pager]
      no_log: true
  always:
    - name: Remove temporary secret file
      ansible.builtin.file:
        path: "{{ secret_file.path }}"
        state: absent
      no_log: true
